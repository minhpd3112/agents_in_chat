# CLIProxyAPI Configuration - Dual Provider Pool (OpenAI + Antigravity)
host: "127.0.0.1"
port: 8090

auth-dir: "./auths"
api-keys: []

request-retry: 1
max-retry-credentials: 4
max-retry-interval: 1

routing:
  strategy: "round-robin"
  session-affinity: false

remote-management:
  disable-auto-update-panel: true
  allow-remote: true
  secret-key: "aic"

openai-compatibility:
  - name: "opencode-zen"
    base-url: "https://opencode.ai/zen/v1"
    api-key-entries:
      - api-key: "public"
    models:
      - name: "muse-spark-1.3-contributor-free"
        alias: "muse-spark-1.3"
        display-name: "Muse Spark 1.3"
        force-mapping: true

oauth-model-alias:
  codex:
    - name: "gpt-6-astra"
      alias: "gpt-6-astra"
      display-name: "GPT-6 Astra"
      force-mapping: true
  antigravity:
    - name: "claude-sonnet-4-6"
      alias: "claude-sonnet-4.6-thinking"
      display-name: "Claude Sonnet 4.6 (Thinking)"
      force-mapping: true
    - name: "gemini-3.8-flash-high"
      alias: "gemini-3.8-flash"
      display-name: "Gemini 3.8 Flash (High)"
      force-mapping: true

oauth-excluded-models:
  codex:
    - "gpt-5.5"
    - "gpt-5.4"
    - "gpt-5.4-mini"
    - "gpt-5.3-codex-spark"
    - "codex-auto-review"
    - "gpt-image-1.5"
    - "gpt-image-2"
  antigravity:
    - "claude-opus-4-6"
    - "claude-opus-4-6-thinking"
    - "gemini-3.7-flash"
    - "gemini-3.7-flash-high"
    - "gemini-3.7-flash-thinking"
    - "gemini-3.7-pro"
    - "gemini-3.5-flash-lite"
    - "gemini-3-flash"
    - "gemini-3.1-flash-image"
    - "gemini-3.1-flash-lite"
    - "gemini-pro-agent"
    - "gemini-3.1-pro-low"
    - "gemini-3-flash-agent"
    - "gemini-3.5-flash-extra-low"
    - "gemini-3.5-flash-low"
    - "gemini-3.6-flash-high"
    - "gpt-oss-120b-medium"

debug: true
